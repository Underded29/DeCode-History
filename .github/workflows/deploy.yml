name: Deploy DeCode to ADM.Tools

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Отримання коду
        uses: actions/checkout@v4

      - name: ⚙️ Встановлення Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ==========================================
      # 1. ЗБІРКА ТА ДЕПЛОЙ ФРОНТЕНДУ
      # ==========================================
      - name: 📦 Встановлення пакетів (Frontend)
        run: |
          cd decode-history/Front-end
          npm install

      - name: 🏗 Збірка (Build) Frontend
        run: |
          cd decode-history/Front-end
          npm run build

      - name: 🚀 Деплой Фронтенду на хостинг
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: decode-history/Front-end/dist/
          server-dir: /

      # 2. ДЕПЛОЙ БЕКЕНДУ
      - name: 🚀 Деплой Бекенду на хостинг
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: decode-history/Back-end/ 
          server-dir: /api/ 
          timeout: 600000
          exclude: |
            **/.env
            **/node_modules/**
            **/uploads/**